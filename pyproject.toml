[project]
name = "algoos"
version = "1.0.0"
description = "AlgoOS distributed competitive-programming judge cluster"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40",
    "botocore>=1.40",
    "fastapi>=0.120",
    "nats-py>=2.11",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "redis>=6.4",
    "uvicorn>=0.38",
    "PyYAML>=6.0",
    "httpx>=0.28",
]

[project.scripts]
algoos = "algoos_cli.main:main"

[dependency-groups]
dev = [
    "cmake>=3.28",
    "ninja>=1.11",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "jsonschema>=4.25",
    "moto[server]>=5.2.5",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
addopts = "-m 'not integration'"  # run integration explicitly with: pytest -m integration
asyncio_mode = "auto"
markers = ["integration: requires live Postgres/NATS/MinIO/Redis services"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["protocol/golden"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "B904"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "python/algoos_protocol",
  "python/algoos_algorithms",
  "python/algoos_control",
  "python/algoos_nodes",
  "python/algoos_api",
  "python/algoos_cli",
  "python/algoos_testing",
]
